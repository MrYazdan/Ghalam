[project]
name = "ghalam"
version = "0.3.2"
description = "Ghalam (قلم) - Fast, elegant screen drawing & annotation tool for Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
]

[project.scripts]
ghalam = "ghalam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghalam"]

[tool.hatch.build.targets.wheel.force-include]
# Ship runtime assets (icons, bundled Vazirmatn fonts) so `get_asset_path` works
# for a plain `pip install ghalam`, not only for the PyInstaller bundle.
"assets" = "assets"

[tool.hatch.build.targets.sdist]
include = [
    "ghalam",
    "assets",
    "README.md",
    "README_FA.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["plans", "tmp", "dist", ".venv", ".idea"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
